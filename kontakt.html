<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Mr X Digital Portfolio</title>
    <meta name="description" content="Kontaktuppgifter till Mr. X.">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body class="page">
    <header class="site-header">
        <nav class="main-nav" aria-label="Huvudmeny">
            <ul class="main-nav__list">
                <li class="main-nav__item"><a class="main-nav__link" href="index.html">Hem</a></li>
                <li class="main-nav__item"><a class="main-nav__link" href="kompetenser.html">Kompetenser</a></li>
                <li class="main-nav__item"><a class="main-nav__link" href="projekt.html">Projekt</a></li>
                <li class="main-nav__item"><a class="main-nav__link" href="utbildning.html">Utbildning</a></li>
                <li class="main-nav__item"><a class="main-nav__link" href="referenser.html">Referenser</a></li>
                <li class="main-nav__item"><a class="main-nav__link main-nav__link--active" href="kontakt.html" aria-current="page">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        <section class="contact">
            <h1 class="contact__title">Kontakta mig</h1>

            <p class="contact__text">
                Har du frågor om mina projekt eller kompetenser?
                Kontakta mig gärna.
            </p>

            <h2 class="contact__subtitle">E-post</h2>
            <p class="contact__text">
                <a class="contact__link" href="mailto:mrx164@hotmail.com">
                    mrx164@hotmail.com
                </a>
            </p> 

            <form class="contact-form" action="tack.php" method="post">
                <label class="contact-form__label" for="name">Namn</label>
                <input class="contact-form__input" type="text" id="name" name="name" required>
            
                <label class="contact-form__label" for="email">E-post</label>
                <input class="contact-form__input" type="email" id="email" name="email" required>
                   
                <label class="contact-form__label" for="subject">Ämne</label>
                <select class="contact-form__select" id="subject" name="subject" required>
                    <option value="">Välj ett ämne</option>
                    <option value="projekt">Projekt</option>
                    <option value="samarbete">Samarbete</option>
                    <option value="ovrigt">Övrigt</option>
                </select>
                   
                <fieldset class="contact-form__group">
                    <legend class="contact-form__legend">Vem kontaktar mig?</legend>
                
                    <input class="contact-form__radio" type="radio" id="student" name="sender" value="student" required>
                    <label class="contact-form__label" for="student">Student</label>
                
                    <input class="contact-form__radio" type="radio" id="company" name="sender" value="foretag">
                    <label class="contact-form__label" for="company">Företag</label>
                </fieldset>
                
                <label class="contact-form__label" for="message">Meddelande</label>
                <textarea class="contact-form__textarea" id="message" name="message" rows="5" required></textarea>

                <button class="contact-form__button" type="submit">
                    Skicka
                </button>       
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2026 Mr. X</p>
    </footer>
</body>

</html>
